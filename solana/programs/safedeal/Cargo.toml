[package]
name = "safedeal"
version = "0.1.0"
description = "SafeDeal — escrow bez pośrednika na Solanie"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "safedeal"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
solana-sha256-hasher = "2.3.0"
